<!DOCTYPE html>

 <head>

  <title>
   Submission History | GradeAI
  </title>
  <link href="../css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <a class="brand" href="../index.html">

  </main>
  <script src="../js/app.js">

</html>
