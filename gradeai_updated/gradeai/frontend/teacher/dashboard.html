<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Teacher Dashboard | GradeAI
  </title>
  <link href="../css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <a class="brand" href="../index.html">
    GradeAI
   </a>
   <a href="questions.html">
    Questions
   </a>
   <button onclick="logout()">
    Sign out
   </button>
  </header>
  <main class="page">
   <p class="eyebrow">
    TEACHER PORTAL
   </p>
   <h1>
    Evaluation dashboard
   </h1>
   <p>
    Review submitted answers and open an evaluation.
   </p>
   <section class="card">
    <div class="row">
     <h2>
      Student submissions
     </h2>
     <a href="history.html">
      View history &rarr;
     </a>
    </div>
    <div class="table-wrap">
     <table>
      <thead>
       <tr>
        <th>
         Student USN
        </th>
        <th>
         Submitted
        </th>
        <th>
         Status
        </th>
        <th>
         Action
        </th>
       </tr>
      </thead>
      <tbody id="submissionRows">
      </tbody>
     </table>
    </div>
   </section>
  </main>
  <script src="../js/app.js">
  </script>
 </body>
</html>
